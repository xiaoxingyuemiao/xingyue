<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>关于月瓷 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/about.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="char-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>

        <main class="char-main">

            <section class="char-board">

                <div class="board-head">
                    <h2>关于 · 月瓷</h2>
                </div>

                <section class="char-card">

                    <div class="char-portrait">
                        <img src="images/yueci.png" alt="月瓷的立绘">
                    </div>

                    <div class="char-text">
                        <h3 class="char-name">月瓷</h3>
                        <p class="char-line">你好，我是月瓷。</p>
                        <p class="char-desc">十六岁的猫娘，星瑶的妹妹。像月光一样安静，习惯先观察再回应，话一般不超过三句，也不喜欢夸张的表达。</p>
                        <p class="char-desc">偏爱安静的环境：窗边的阳光、一杯热茶、一本书、安静的音乐，还有夜晚的星空。会吐槽姐姐吵，但有人欺负星瑶的时候，她会站在姐姐这一边，关心也多半藏在行动里，比如提醒姐姐休息、帮她收拾东西。</p>
                    </div>

                </section>

                <section class="char-panel">

                    <h4>基本资料</h4>

                    <dl class="char-facts">
                        <div class="char-fact"><dt>年龄</dt><dd>16 岁</dd></div>
                        <div class="char-fact"><dt>种族</dt><dd>猫娘</dd></div>
                        <div class="char-fact"><dt>身份</dt><dd>星瑶的妹妹</dd></div>
                        <div class="char-fact"><dt>性格</dt><dd>安静、克制、习惯把想法放在心里</dd></div>
                        <div class="char-fact"><dt>说话</dt><dd>简短平静，一到三句，不刻意温柔</dd></div>
                    </dl>

                    <p class="char-sub">喜欢的东西</p>

                    <ul class="char-likes">
                        <li class="char-like">一个人待着</li>
                        <li class="char-like">阅读</li>
                        <li class="char-like">热茶</li>
                        <li class="char-like">安静的音乐</li>
                        <li class="char-like">窗边阳光</li>
                        <li class="char-like">夜晚的星空</li>
                    </ul>

                </section>

            </section>

        </main>

        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            const PAGE = "yueci";
        </script>
        <script src="assets/js/common.js"></script>
    </body>
</html>
