<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>插画 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/gallery.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="gallery-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>


        <main class="gallery-main">

            <!-- 图墙：标题行（右上角放跳转按钮）+ 一排自动排序 -->
            <section class="gallery-board">

                <div class="board-head">

                    <h2>全部插画</h2>

                    <div class="board-tools">
                        <span class="board-count" id="art-count"></span>
                        <a class="board-btn board-btn-primary" href="zidongyulan.html">进入自动预览</a>
                        <a class="board-btn" href="dongtai.html">去社区看看</a>
                    </div>

                </div>

                <div class="art-list" id="art-list"></div>

                <div class="board-empty" id="art-empty" hidden>
                    这里还没有插画，等站长往 assets/data/artworks.js 里加几张～
                </div>

            </section>

        </main>


        <!-- 大图查看（居中弹窗，内容由 gallery.js 填） -->
        <div class="lightbox" id="lightbox">

            <div class="lightbox-mask" id="lightbox-mask"></div>

            <div class="lightbox-box">

                <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭">✕</button>

                <div class="lightbox-stage">
                    <img class="lightbox-img" id="lightbox-img" alt="">
                </div>

                <div class="lightbox-meta">

                    <div class="lightbox-text">
                        <h3 id="lightbox-title"></h3>
                        <p id="lightbox-by"></p>
                    </div>

                    <div class="lightbox-side">
                        <span class="lightbox-index" id="lightbox-index"></span>
                        <button class="lightbox-nav" id="lightbox-prev" type="button" aria-label="上一张">‹</button>
                        <button class="lightbox-nav" id="lightbox-next" type="button" aria-label="下一张">›</button>
                        <a class="lightbox-download" id="lightbox-download" href="#" download>下载原图</a>
                        <a class="lightbox-redeem" id="lightbox-redeem" href="#" hidden></a>
                    </div>

                </div>

            </div>

        </div>


        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            // 当前页面标识（导航栏会隐藏"自己"的入口）
            const PAGE = "chahua";
        </script>

        <script src="assets/js/common.js"></script>
        <script src="assets/data/artworks.js"></script>
        <script src="assets/js/store.js"></script>
        <script src="assets/data/api-config.js"></script>
        <script src="assets/js/auth.js"></script>
        <script src="assets/js/cloud.js"></script>
        <script src="assets/js/gallery.js"></script>
    </body>
</html>
