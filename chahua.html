<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>插画 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/gallery.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="gallery-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>

        <!-- 横向长画廊：画框与背景花草都由 assets/js/gallery.js 随机生成 -->
        <main class="gallery">

            <div class="gallery-viewport" id="gallery-viewport">

                <div class="gallery-canvas" id="gallery-canvas">

                    <!-- 背景的花草树木 -->
                    <div class="gallery-deco" id="gallery-deco"></div>

                    <!-- 画框（从左到右编号，编号只写在 data 属性里，不显示） -->
                    <div class="gallery-frames" id="gallery-frames"></div>

                    <!-- 「进入自动预览」按钮：位置由 gallery.js 算，挂在第三个画框正上方 -->
                    <a class="frame-action" id="frame-action" href="zidongyulan.html">进入自动预览</a>

                </div>

            </div>

            <!-- 毛线球滚动条：拖它、点轨道、滚轮都能移动画廊 -->
            <div class="yarn-bar" id="yarn-bar">
                <div class="yarn-thread"></div>
                <div class="yarn-ball" id="yarn-ball" title="拖动我去逛画廊"></div>
            </div>

        </main>

        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            // 当前页面标识（导航栏会隐藏"自己"的入口）
            const PAGE = "chahua";
        </script>

        <script src="assets/js/common.js"></script>
        <script src="assets/js/gallery.js"></script>
    </body>
</html>
