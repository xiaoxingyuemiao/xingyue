<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/home.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>

    <body>

        <!-- 首次进入的登录页（Pixiv 风格：整屏插画 + 右侧白色卡片） -->
        <div class="auth-screen">

            <!-- 背景：星瑶 / 月瓷 轮播，先显示星瑶，每 5 秒换一张 -->
            <div class="auth-bg">
                <img class="auth-bg-img" src="images/xingyao-bg.jpg" alt="">
                <img class="auth-bg-img" src="images/yueci-bg.jpg" alt="">
            </div>

            <!-- 压暗一层，白卡片和文字才看得清 -->
            <div class="auth-overlay"></div>

            <!-- 登录卡（进入网站直接显示；密码 / 验证码两种方式） -->
            <div class="auth-box" id="start-step-login">

                <h1>
                    登录
                </h1>

                <input class="auth-input" id="login-email" type="email" placeholder="邮箱" autocomplete="email">

                <!-- 方式一：密码 -->
                <div id="login-mode-password">
                    <div class="auth-pwd">
                        <input class="auth-input" id="login-password" type="password" placeholder="密码" autocomplete="current-password">
                        <button class="auth-eye" type="button" data-target="login-password" aria-label="显示密码"></button>
                    </div>
                </div>

                <!-- 方式二：验证码 -->
                <div id="login-mode-code" hidden>
                    <div class="auth-row">
                        <input class="auth-input" id="login-code" type="text" inputmode="numeric" maxlength="10" placeholder="验证码">
                        <button class="auth-btn-soft auth-btn-inline" id="login-send" type="button">
                            发送
                        </button>
                    </div>
                </div>

                <button class="auth-btn-primary" id="login-submit" type="button">
                    登录
                </button>

                <div class="auth-links-row">
                    <button class="auth-link" id="login-switch" type="button">
                        改用验证码登录
                    </button>
                    <button class="auth-link" id="login-forgot" type="button">
                        忘记密码？
                    </button>
                </div>

                <button class="auth-link" id="login-to-register" type="button">
                    没有账号？去注册一个吧
                </button>

                <button class="auth-link guest-button" id="login-guest" type="button">
                    先随便逛逛（游客进入）
                </button>

                <div class="auth-msg" id="login-msg"></div>

            </div>

            <!-- 注册卡（邮箱 + 密码 + 确认密码 + 验证码） -->
            <div class="auth-box" id="start-step-register" hidden>

                <h1>
                    注册
                </h1>

                <input class="auth-input" id="reg-email" type="email" placeholder="邮箱" autocomplete="email">

                <div class="auth-pwd">
                    <input class="auth-input" id="reg-password" type="password" placeholder="密码（至少 8 位，含字母和数字）" autocomplete="new-password">
                    <button class="auth-eye" type="button" data-target="reg-password" aria-label="显示密码"></button>
                </div>
                <div class="auth-hint" id="reg-password-hint"></div>

                <div class="auth-pwd">
                    <input class="auth-input" id="reg-password2" type="password" placeholder="再次输入密码" autocomplete="new-password">
                    <button class="auth-eye" type="button" data-target="reg-password2" aria-label="显示密码"></button>
                </div>
                <div class="auth-hint" id="reg-password2-hint"></div>

                <div class="auth-row">
                    <input class="auth-input" id="reg-code" type="text" inputmode="numeric" maxlength="10" placeholder="验证码">
                    <button class="auth-btn-soft auth-btn-inline" id="reg-send" type="button">
                        发送
                    </button>
                </div>

                <button class="auth-btn-primary" id="reg-submit" type="button">
                    注册
                </button>

                <button class="auth-link" id="reg-to-login" type="button">
                    已经有账号了？去登录吧
                </button>

                <div class="auth-msg" id="reg-msg"></div>

            </div>

            <!-- 找回密码卡（邮箱验证码 → 新密码） -->
            <div class="auth-box" id="start-step-forgot" hidden>

                <h1>
                    重置密码
                </h1>

                <input class="auth-input" id="fg-email" type="email" placeholder="邮箱" autocomplete="email">

                <div class="auth-row">
                    <input class="auth-input" id="fg-code" type="text" inputmode="numeric" maxlength="10" placeholder="验证码">
                    <button class="auth-btn-soft auth-btn-inline" id="fg-send" type="button">
                        发送
                    </button>
                </div>

                <div class="auth-pwd">
                    <input class="auth-input" id="fg-password" type="password" placeholder="新密码（至少 8 位，含字母和数字）" autocomplete="new-password">
                    <button class="auth-eye" type="button" data-target="fg-password" aria-label="显示密码"></button>
                </div>
                <div class="auth-hint" id="fg-password-hint"></div>

                <div class="auth-pwd">
                    <input class="auth-input" id="fg-password2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
                    <button class="auth-eye" type="button" data-target="fg-password2" aria-label="显示密码"></button>
                </div>
                <div class="auth-hint" id="fg-password2-hint"></div>

                <button class="auth-btn-primary" id="fg-submit" type="button">
                    重置密码
                </button>

                <button class="auth-link" id="fg-back" type="button">
                    ← 返回登录
                </button>

                <div class="auth-msg" id="fg-msg"></div>

            </div>

        </div>


        <!-- ==================== 首页 ==================== -->

        <div class="home-screen">

            <!-- 左侧导航栏（默认收起，可点击 ☰ 展开） -->
            <aside class="sidebar">

                <!-- 导航栏顶部（图标 = 网站图标，可点击展开/收起） -->
                <div class="sidebar-header">

                    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="展开或收起侧边栏">
                        <img src="images/wangzhanmeiye.png" alt="星月">
                    </button>

                </div>


                <!-- 导航菜单（以后图标用真实图标替换） -->
                <nav class="sidebar-menu">

                    <a href="#" class="sidebar-item active">
                        <span class="sidebar-text">首页</span>
                    </a>

                    <a href="#" class="sidebar-item" id="menu-gallery">
                        <span class="sidebar-text">插画</span>
                    </a>

                    <a href="#" class="sidebar-item" id="menu-merch">
                        <span class="sidebar-text">周边</span>
                    </a>

                    <a href="#" class="sidebar-item" id="menu-news">
                        <span class="sidebar-text">动态</span>
                    </a>

                    <!-- 关于：本身不可点击，鼠标移上去展开子菜单 -->
                    <div class="sidebar-item sidebar-item-parent">

                        <span class="sidebar-text">关于</span>

                        <div class="sidebar-submenu">

                            <a href="xingyao.html" class="sidebar-submenu-item">星瑶</a>
                            <a href="yueci.html" class="sidebar-submenu-item">月瓷</a>
                            <a href="xiaomiao.html" class="sidebar-submenu-item">小喵</a>

                        </div>

                    </div>

                    <a href="#" class="sidebar-item" id="menu-live2d">
                        <span class="sidebar-text">Live2D</span>
                    </a>

                    <a href="#" class="sidebar-item" id="menu-settings">
                        <span class="sidebar-text">设置</span>
                    </a>

                </nav>


                <!-- 用户区域（点击进入用户设置） -->
                <div class="sidebar-user" id="sidebar-user">

                    <div class="user-avatar" id="user-avatar">
                        🐱
                    </div>

                    <div class="user-info">

                        <span class="user-name" id="user-name">
                            小喵
                        </span>

                        <span class="user-status">
                            游客
                        </span>

                    </div>

                </div>

            </aside>


            <!-- ==================== 主空间 ==================== -->

            <main class="app-space">

                <!-- 背景 -->
                <div class="background"></div>


                <!-- Live2D（支持 Cubism 2 / 4 / 5 各 SDK 模型） -->
                <div class="live2d-stage">

                    <div class="live2d-placeholder" id="live2d-placeholder">
                        Live2D
                    </div>

                    <div class="live2d-container" id="live2d-container"></div>

                </div>


                <!-- 聊天区域（消息由 main.js 渲染） -->
                <section class="chat-area">

                    <div class="message-list">

                    </div>

                </section>


                <!-- 输入区域 -->
                <div class="chat-input">

                    <button class="chat-role-btn" id="chat-role-btn" type="button" title="选择聊天角色">
                        <img src="images/shuruokuangrewu.png" alt="角色">
                    </button>

                    <input
                        type="text"
                        placeholder="输入消息……"
                    >

                    <button type="button">
                        ➤
                    </button>

                </div>


                <!-- 角色选择面板（点击输入框左侧按钮打开） -->
                <div class="role-picker" id="role-picker" hidden>

                    <div class="role-picker-list" id="role-picker-list"></div>

                </div>


            </main>

        </div>


        <!-- 拦截 SDK 对外部网络请求（unpkg 版本检查、hitokoto 一言，国内无法访问），
             返回模拟响应避免初始化失败；必须在 SDK 之前执行 -->
        <script src="assets/js/net-mock.js"></script>

        <!-- Live2D SDK（oh-my-live2d 0.19 版，样式内联无需 CSS 文件；
             优先加载本地 vendor 文件，缺失时回退 CDN） -->
        <script src="assets/vendor/oh-my-live2d.min.js" onerror="
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/oh-my-live2d@0.19.3/dist/index.min.js';
            document.head.appendChild(s);
        "></script>

        <script src="assets/js/store.js"></script>
        <script src="assets/data/official-roles.js"></script>
        <script src="assets/data/models.js"></script>
        <script src="assets/data/supabase-config.js"></script>
        <script src="assets/js/auth.js"></script>
        <script src="assets/js/live2d.js"></script>
        <script src="assets/js/live2d-custom.js"></script>
        <script src="assets/js/main.js"></script>

    </body>
</html>
