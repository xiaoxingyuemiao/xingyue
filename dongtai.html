<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>社区 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/community.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="community-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>


        <main class="community-main">

            <section class="community-board">

                <div class="board-head">

                    <h2>社区</h2>

                </div>


                <!-- 发布卡（样式参考 B 站动态：头像 + 输入框 + 底部工具条） -->
                <section class="publish-card">

                    <div class="publish-avatar" id="publish-avatar">🌙</div>

                    <div class="publish-box">

                        <textarea class="publish-input" id="post-input" rows="3" maxlength="1000"
                                  placeholder="分享你的插画、周边或者今天的心情～"></textarea>

                        <!-- 已选配图（缩略图 + 删除角标），内容由 community.js 填 -->
                        <div class="publish-images" id="post-images"></div>

                        <div class="publish-bar">

                            <button class="publish-tool" id="post-image-btn" type="button">🖼️ 图片</button>
                            <input class="publish-file" id="post-image-file" type="file" accept="image/*" multiple hidden>

                            <span class="publish-tip" id="post-count-tip">0 / 1000</span>

                            <button class="publish-submit" id="post-submit" type="button">发布</button>

                        </div>

                        <p class="publish-status" id="post-status"></p>

                    </div>

                </section>


                <!-- 动态时间线（内容由 community.js 填） -->
                <div class="post-list" id="post-list"></div>

                <div class="board-empty" id="post-empty" hidden>
                    社区还空着，发第一条动态吧～
                </div>

                <div class="board-more">
                    <button class="board-btn" id="post-more" type="button" hidden>查看更多动态</button>
                </div>

            </section>

        </main>


        <!-- 配图大图查看 -->
        <div class="viewer" id="viewer">

            <div class="viewer-mask" id="viewer-mask"></div>

            <img class="viewer-img" id="viewer-img" alt="">

            <button class="viewer-close" id="viewer-close" type="button" aria-label="关闭">✕</button>
            <span class="viewer-index" id="viewer-index"></span>
            <button class="viewer-nav viewer-prev" id="viewer-prev" type="button" aria-label="上一张">‹</button>
            <button class="viewer-nav viewer-next" id="viewer-next" type="button" aria-label="下一张">›</button>

        </div>


        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            // 当前页面标识（导航栏会隐藏"自己"的入口）
            const PAGE = "dongtai";
        </script>

        <script src="assets/js/common.js"></script>
        <script src="assets/js/store.js"></script>
        <script src="assets/data/api-config.js"></script>
        <script src="assets/js/auth.js"></script>
        <script src="assets/js/cloud.js"></script>
        <script src="assets/js/community.js"></script>
    </body>
</html>
