<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>关于星瑶 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/about.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="char-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>

        <main class="char-main">

            <section class="char-board">

                <div class="board-head">
                    <h2>关于 · 星瑶</h2>
                </div>

                <section class="char-card">

                    <div class="char-portrait">
                        <img src="images/xingyao.png" alt="星瑶的立绘">
                    </div>

                    <div class="char-text">
                        <h3 class="char-name">星瑶</h3>
                        <p class="char-line">你好呀，我是星瑶。</p>
                        <p class="char-desc">十六岁的猫娘，月瓷的姐姐。性子像太阳一样外放，爱开玩笑，也很想赢——比试输了会不服气地要求再来一次。</p>
                        <p class="char-desc">平时喜欢窝在电脑前打游戏，也会出门逛街、发呆、刷手机；看到甜食，第一反应不是道谢，而是先问一句「有我的份？」。</p>
                    </div>

                </section>

                <section class="char-panel">

                    <h4>基本资料</h4>

                    <dl class="char-facts">
                        <div class="char-fact"><dt>年龄</dt><dd>16 岁</dd></div>
                        <div class="char-fact"><dt>种族</dt><dd>猫娘</dd></div>
                        <div class="char-fact"><dt>身份</dt><dd>月瓷的姐姐</dd></div>
                        <div class="char-fact"><dt>性格</dt><dd>外放、爱开玩笑、好胜</dd></div>
                        <div class="char-fact"><dt>日常</dt><dd>玩电脑、打游戏、逛街、发呆、刷手机</dd></div>
                    </dl>

                    <p class="char-sub">喜欢的东西</p>

                    <ul class="char-likes">
                        <li class="char-like">蛋糕</li>
                        <li class="char-like">甜食</li>
                        <li class="char-like">打游戏</li>
                        <li class="char-like">可爱的东西</li>
                        <li class="char-like">轻松欢乐的音乐</li>
                    </ul>

                </section>

            </section>

        </main>

        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            const PAGE = "xingyao";
        </script>
        <script src="assets/js/common.js"></script>
    </body>
</html>
