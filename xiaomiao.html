<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>关于小喵 - 星月小窝</title>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/about.css">

        <link rel="icon" href="images/wangzhanmeiye.png">
    </head>
    <body class="char-body">

        <!-- 导航栏（由 assets/js/common.js 注入） -->
        <div id="site-header"></div>

        <main class="char-main">

            <section class="char-board">

                <div class="board-head">
                    <h2>关于 · 小喵</h2>
                </div>

                <section class="char-card">

                    <div class="char-portrait emoji">🐱</div>

                    <div class="char-text">
                        <h3 class="char-name">小喵</h3>
                        <p class="char-line">这一页还是空的。</p>
                        <p class="char-desc">星瑶和月瓷都把小喵叫作「创造者」——小窝里的角色、模型和设定都出自小喵之手，对她们来说也是家人的角色。</p>
                        <p class="char-desc">不过小喵自己是个什么样的人，设定里还没写，这一页先把位置留好。</p>
                    </div>

                </section>

                <section class="char-panel">

                    <h4>基本资料</h4>

                    <dl class="char-facts">
                        <div class="char-fact"><dt>身份</dt><dd>星瑶与月瓷的创造者</dd></div>
                        <div class="char-fact"><dt>立绘</dt><dd class="todo">暂无，先用 🐱 占位</dd></div>
                        <div class="char-fact"><dt>年龄</dt><dd class="todo">待定</dd></div>
                        <div class="char-fact"><dt>性格</dt><dd class="todo">待定</dd></div>
                    </dl>

                    <p class="char-note">带「待定」的几项是设定里还没有的内容，先空着不编。小喵的人设补上之后，这页会照星瑶、月瓷的格式一起填好。</p>

                </section>

            </section>

        </main>

        <!-- 页脚（由 assets/js/common.js 注入） -->
        <div id="site-footer"></div>

        <script>
            const PAGE = "xiaomiao";
        </script>
        <script src="assets/js/common.js"></script>
    </body>
</html>
